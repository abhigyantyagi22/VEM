services:
  - type: web
    name: vem-backend
    env: java
    rootDir: backend
    buildCommand: mvn -DskipTests package
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://vem-ochre.vercel.app
      - key: SERVER_PORT
        value: 8080